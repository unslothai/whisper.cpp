name: Unsloth whisper prebuilt (full release)

# One workflow run, one release per upstream whisper.cpp tag. Releases are
# SLIM-ONLY: the single build child is
#   unsloth-prebuilt-slim.yml -- Slim bundles (Linux + Windows + macOS, x64 +
#                                arm64) compiled against the paired
#                                unslothai/llama.cpp release's ggml; they ship
#                                NO libggml* (the llama install provides every
#                                ggml backend: cpu variants, cuda, hip, vulkan,
#                                metal). One bundle per os/arch serves every
#                                accelerator on that platform.
#
# The fat per-accelerator children (unsloth-prebuilt-cpu / -macos / -cuda /
# -cuda-windows / -vulkan / -rocm) are intentionally NOT invoked anymore: the
# llama.cpp prebuilts are always installed alongside whisper, so shipping a
# second copy of every ggml backend inside whisper bundles bought nothing.
# The workflow files are kept on disk for reference and ad-hoc dispatch only.
#
# P0 atomicity: the `assemble` job hard-requires the slim child. Every slice
# is required (windows/arm64 builds natively on windows-11-arm now, so it is
# no longer best-effort); the "Verify P0 coverage" gate below refuses to
# publish unless the full required slim set exists at one tag.
#
# Immutability: `resolve` dereferences the requested upstream tag to an exact
# commit SHA and records it. Every child builds that one stamped source tree
# (uploaded once as a workflow artifact), so a tag re-point upstream cannot
# change what a given packaging tag shipped.

on:
  # Auto-stream from mainline whisper.cpp: every 5 days at ~3PM San Francisco
  # (22:41 UTC; a fixed offset, not DST-adjusted, so ~3:41PM PDT / ~2:41PM PST).
  # `*/5` fires on days 1,6,11,16,21,26,31, so the spacing resets at each month
  # boundary -- close enough given upstream tags land weeks apart. A scheduled
  # run resolves the newest aged upstream release and publishes it; if that
  # release is already published AND still pairs with the newest published
  # unslothai/llama.cpp ggml, the run is a cheap no-op (resolve sets exists=true
  # and every build/assemble job is skipped). If llama has moved to a new ggml
  # commit since, resolve rolls the packaging suffix to the next free ordinal
  # and republishes, so the slim bundles keep loading against the llama install
  # Studio actually ships. Manual dispatch can still build or publish any tag on
  # demand, and never auto-rolls the suffix it was given.
  schedule:
    - cron: '41 22 * * *'
  # Fired by unslothai/llama.cpp after it publishes. Treated purely as a
  # wake-up: nothing from client_payload is read, the newest published llama
  # release is re-resolved from the API instead, so a stale or forged payload
  # cannot steer the build.
  repository_dispatch:
    types: [llama-published]
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream ggml-org/whisper.cpp tag to build, or "latest" to resolve the newest aged release'
        default: 'latest'
        required: false
        type: string
      packaging_suffix:
        description: 'Packaging suffix appended to the tag: <upstream_tag>-<suffix> (blank = newest published ordinal for that tag)'
        default: ''
        required: false
        type: string
      llama_tag:
        description: 'Paired unslothai/llama.cpp release tag for slim bundles (blank = newest published llama release)'
        default: ''
        required: false
        type: string
      min_age_hours:
        description: 'For "latest": only build an upstream release public for at least this many hours (blank = 6)'
        default: ''
        required: false
        type: string
      publish:
        description: 'Publish a GitHub Release (off = build + upload artifacts only). Scheduled runs always publish.'
        default: false
        required: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.upstream_tag || 'scheduled' }}-${{ github.event.inputs.packaging_suffix || 'auto' }}
  # Automatic wake-ups supersede each other. They all land in one group, so
  # without this a single run stuck in the runner queue blocks every later
  # dispatch indefinitely -- the same "whisper quietly stops publishing"
  # outcome, reached a different way. Superseding costs nothing: the newer run
  # re-resolves the newest llama release from the API, so anything the older
  # one was still working out is already out of date. A dispatch that names a
  # tag is someone building deliberately, and waits its turn instead.
  cancel-in-progress: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' }}

jobs:
  resolve:
    name: Resolve tag + stamp source
    # arm64, and the same for assemble/alert below: these three only run git,
    # sed, tar, gh and python, so the architecture is irrelevant to them, and
    # ubuntu-22.04 is the most contended label we use. On 08-06 the whole
    # matrix was created at 19:12:29 and linux/arm64 got a runner in 34
    # minutes while linux/x64 waited 2h54m. resolve gates every build job, so
    # its queue wait is paid by the whole run: it cost 83 minutes that night.
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.r.outputs.upstream_tag }}
      tag: ${{ steps.r.outputs.tag }}
      commit: ${{ steps.r.outputs.commit }}
      repo: ${{ steps.r.outputs.repo }}
      source_artifact: ${{ steps.r.outputs.source_artifact }}
      exists: ${{ steps.r.outputs.exists }}
      llama_tag: ${{ steps.r.outputs.llama_tag }}
      llama_ggml_tree: ${{ steps.r.outputs.llama_ggml_tree }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve immutable commit + stamp source tree
        id: r
        run: |
          set -euo pipefail
          UT='${{ github.event.inputs.upstream_tag || 'latest' }}'
          SUFFIX='${{ github.event.inputs.packaging_suffix }}'
          AGE_H='${{ github.event.inputs.min_age_hours }}'
          [ -n "$AGE_H" ] || AGE_H=6

          # The real ABI key: the git tree id of ggml/ in the llama release we
          # compile against, published in its manifest. Empty for releases cut
          # before llama started recording it.
          llama_ggml_tree() {
            gh release download "$1" --repo unslothai/llama.cpp \
              --pattern llama-prebuilt-manifest.json --output - 2>/dev/null \
              | jq -r '.ggml_tree // empty' 2>/dev/null || true
          }

          # Fallback only. The "-mix-" suffix looks like a ggml commit but is a
          # hash of llama's pinned PR set, so it stays constant while the base
          # tag and ggml move: 53618c5 alone covers b9909 through b10001. Used
          # when a manifest predates ggml_tree, where the alternative is a
          # rebuild loop.
          ggml_commit() {
            case "$1" in
              *-mix-?*) printf '%s' "${1##*-mix-}" ;;
              *)        printf '%s' "$1" ;;
            esac
          }

          # Resolve "latest" (the default, and what every scheduled run uses) to
          # the newest published upstream release that has been public for >=
          # AGE_H hours -- a supply-chain aging window so a yanked or malicious
          # upstream tag is not shipped the instant it appears. GitHub does not
          # guarantee list order, so pick the max by published_at explicitly. An
          # explicit vX.Y.Z tag (manual dispatch) skips the filter.
          if [ "$UT" = "latest" ]; then
            CUTOFF="$(date -u -d "-${AGE_H} hours" +%s)"
            UT="$(gh api 'repos/ggml-org/whisper.cpp/releases?per_page=100' \
              --jq "[.[] | select(.draft==false and .prerelease==false) | select((.published_at|fromdateiso8601) <= ${CUTOFF})] | max_by(.published_at|fromdateiso8601) | .tag_name")"
            if [ -z "$UT" ] || [ "$UT" = "null" ]; then
              echo "refusing: no ggml-org/whisper.cpp release older than ${AGE_H}h in the last 100 releases" >&2
              exit 1
            fi
            echo "selected upstream ${UT} (aged >= ${AGE_H}h)"
          fi
          printf '%s' "$UT" | grep -qE '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            || { echo "refusing non-release upstream tag '$UT' (want vMAJOR.MINOR[.PATCH])" >&2; exit 1; }

          # A blank packaging suffix means the NEWEST published ordinal for this
          # upstream tag, not ".1". Only the newest ordinal carries the current
          # slim pairing; ".1" predates the slim model and has no
          # requires_llama_tag, so the staleness comparison below bails and the
          # roll never fires however far llama drifts.
          #
          # Must run after UT is a concrete tag: resolving it against UT="latest"
          # matches no releases and silently falls back to ".1", which is the
          # very bug this is here to prevent.
          if [ -z "$SUFFIX" ]; then
            NEWEST_ORD="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq "[.[] | select(.draft==false) | .tag_name
                    | select(startswith(\"${UT}-unsloth.\"))
                    | ltrimstr(\"${UT}-unsloth.\")
                    | select(test(\"^[0-9]+$\")) | tonumber] | max // empty")"
            [ -n "$NEWEST_ORD" ] || NEWEST_ORD=1
            SUFFIX="unsloth.${NEWEST_ORD}"
            echo "no packaging suffix given; using newest published ordinal ${SUFFIX}"
          fi
          printf '%s' "$SUFFIX" | grep -qE '^[A-Za-z0-9._-]+$' \
            || { echo "refusing packaging suffix '$SUFFIX'" >&2; exit 1; }
          TAG="${UT}-${SUFFIX}"
          REPO="$GITHUB_REPOSITORY"

          # Slim bundles are compiled against the ggml tree of a PAIRED
          # unslothai/llama.cpp release (the llama install provides every ggml
          # library at runtime). A blank llama_tag -- including every scheduled
          # run -- resolves to the newest PUBLISHED llama release, same style
          # as the upstream-tag resolution above.
          LT='${{ github.event.inputs.llama_tag }}'
          if [ -z "$LT" ]; then
            LT="$(gh api 'repos/unslothai/llama.cpp/releases?per_page=30' \
              --jq '[.[] | select(.draft==false and .prerelease==false)] | max_by(.published_at|fromdateiso8601) | .tag_name')"
            if [ -z "$LT" ] || [ "$LT" = "null" ]; then
              echo "refusing: no published unslothai/llama.cpp release found for slim pairing" >&2
              exit 1
            fi
            echo "selected paired llama release ${LT}"
          fi
          printf '%s' "$LT" | grep -qE '^[A-Za-z0-9._-]+$' \
            || { echo "refusing llama tag '$LT'" >&2; exit 1; }

          # Empty for llama releases cut before ggml_tree was recorded; the
          # comparison below falls back to the suffix in that case.
          LT_TREE="$(llama_ggml_tree "$LT")"
          printf '%s' "$LT_TREE" | grep -qE '^[0-9a-f]{40}$' || LT_TREE=""
          echo "paired llama ${LT} ggml tree: ${LT_TREE:-unknown}"

          # Dereference the tag to an exact commit (annotated tags resolve to the
          # tag object first, then to the commit it points at).
          REF_JSON="$(gh api "repos/ggml-org/whisper.cpp/git/ref/tags/${UT}")"
          OBJ_TYPE="$(jq -r '.object.type' <<<"$REF_JSON")"
          OBJ_SHA="$(jq -r '.object.sha' <<<"$REF_JSON")"
          if [ "$OBJ_TYPE" = "tag" ]; then
            COMMIT="$(gh api "repos/ggml-org/whisper.cpp/git/tags/${OBJ_SHA}" --jq '.object.sha')"
          else
            COMMIT="$OBJ_SHA"
          fi
          printf '%s' "$COMMIT" | grep -qE '^[0-9a-f]{40}$' \
            || { echo "could not resolve ${UT} to a commit" >&2; exit 1; }
          echo "resolved ${UT} -> ${COMMIT}"

          EXISTS=false
          PAIRED=false
          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null || true)" = "false" ]; then
            EXISTS=true
          fi

          # Slim bundles only load against a llama install whose ggml ABI they
          # were built for, so a published packaging tag goes stale the moment
          # unslothai/llama.cpp ships a new ggml commit -- the installer's
          # llama_runtime_pairs() then rejects it and Studio setup reports
          # "no compatible prebuilt", falling back to Transformers dictation.
          # The packaging tag encodes only the upstream whisper version, so
          # `exists` alone would make every scheduled run a no-op for as long
          # as upstream stays on one tag, however far llama drifts. Compare the
          # published release's own pairing against the llama tag resolved
          # above and, when it no longer pairs, roll the packaging suffix to the
          # next free ordinal so the schedule republishes.
          #
          # Only schedules auto-roll. A manual dispatch names its packaging
          # suffix deliberately (rebuilding one tag, pinning an older llama),
          # and silently publishing a different tag than asked for would be a
          # surprise. Immutability is preserved either way: an already-published
          # tag is never rebuilt, only superseded.
          if [ "$EXISTS" = "true" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; }; then
            PUBLISHED_MANIFEST="$(gh release download "$TAG" --repo "$REPO" \
              --pattern whisper-prebuilt-manifest.json --output - 2>/dev/null || true)"
            PUBLISHED_LT="$(jq -r 'first(.artifacts[]? | select(.install_kind == "slim") | .requires_llama_tag) // empty' <<<"$PUBLISHED_MANIFEST" 2>/dev/null || true)"
            PUBLISHED_TREE="$(jq -r 'first(.artifacts[]? | select(.install_kind == "slim") | .requires_ggml_tree) // empty' <<<"$PUBLISHED_MANIFEST" 2>/dev/null || true)"
            if [ -z "$PUBLISHED_LT" ]; then
              # Unreadable manifest, or a pre-slim release with no pairing to go
              # stale. Neither is evidence that a rebuild is needed, so stay a
              # no-op rather than republish on a guess.
              echo "note: ${TAG} publishes no slim pairing to compare; leaving exists=true"
            elif [ -n "$PUBLISHED_TREE" ] && [ -n "$LT_TREE" ]; then
              # Both sides know their ggml tree: compare it and nothing else.
              if [ "$PUBLISHED_TREE" = "$LT_TREE" ]; then
                echo "${TAG} pairs with ${LT} (ggml tree ${LT_TREE}); nothing to do"
                PAIRED=true
              fi
            elif [ "$(ggml_commit "$PUBLISHED_LT")" = "$(ggml_commit "$LT")" ]; then
              # One side predates ggml_tree. Approximate, and say so.
              echo "::warning::${TAG} compared against ${LT} on the -mix- suffix, which does not track ggml; treating as paired"
              PAIRED=true
            fi
            if [ "$PAIRED" != "true" ] && [ -n "$PUBLISHED_LT" ]; then
              PREFIX="${SUFFIX%.*}"
              ORDINAL="${SUFFIX##*.}"
              if [ "$PREFIX" = "$SUFFIX" ] || ! printf '%s' "$ORDINAL" | grep -qE '^[0-9]+$'; then
                echo "note: packaging suffix '${SUFFIX}' is not <prefix>.<N>; cannot roll it automatically" >&2
              else
                # Highest published ordinal + 1, not $ORDINAL + 1: a manual
                # dispatch may already have taken the next few, and reusing a
                # published tag would break immutability.
                NEXT="$(gh api "repos/${REPO}/releases?per_page=100" \
                  --jq "[.[] | select(.draft==false) | .tag_name
                        | select(type == \"string\" and startswith(\"${UT}-${PREFIX}.\"))
                        | ltrimstr(\"${UT}-${PREFIX}.\")
                        | select(test(\"^[0-9]+$\")) | tonumber] | (max // 0) + 1")"
                echo "${TAG} requires llama ${PUBLISHED_LT} but ${LT} is current;" \
                     "rebuilding as ${UT}-${PREFIX}.${NEXT}"
                SUFFIX="${PREFIX}.${NEXT}"
                TAG="${UT}-${SUFFIX}"
                EXISTS=false
              fi
            fi
          fi

          # Check out the exact commit and stamp cmake/build-info.cmake so the
          # server reports a real version (the tarball ships without .git, where
          # build-info falls back to BUILD_NUMBER 0 / "unknown"). Unlike
          # llama.cpp, whisper.cpp does NOT compile BUILD_TARGET into whisper-server
          # (it only feeds BUILD_NUMBER/COMMIT into install-time cmake config
          # files), so the Unsloth fingerprint cannot be baked into the binary
          # here; package_bundle.py carries it in every bundle's BUILD_INFO.txt,
          # which the assemble verify gate then checks.
          git init -q whisper-src
          cd whisper-src
          git remote add origin https://github.com/ggml-org/whisper.cpp.git
          git fetch -q --depth 1 origin "$COMMIT"
          git checkout -q --detach FETCH_HEAD
          COUNT="$(git rev-list --count HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          sed -i "s/^set(BUILD_NUMBER 0)$/set(BUILD_NUMBER ${COUNT})/" cmake/build-info.cmake
          sed -i "s/^set(BUILD_COMMIT \"unknown\")$/set(BUILD_COMMIT \"${SHORT}\")/" cmake/build-info.cmake
          grep -q "set(BUILD_NUMBER ${COUNT})" cmake/build-info.cmake \
            && grep -q "set(BUILD_COMMIT \"${SHORT}\")" cmake/build-info.cmake \
            || { echo "cmake/build-info.cmake lost its expected fallback lines" >&2; exit 1; }
          cd ..

          tar -czf "${RUNNER_TEMP}/whisper.cpp-source-${TAG}.tar.gz" \
            --exclude-vcs --transform "s,^whisper-src,whisper.cpp-${TAG}," whisper-src

          {
            echo "upstream_tag=$UT"
            echo "tag=$TAG"
            echo "commit=$COMMIT"
            echo "repo=$REPO"
            echo "source_artifact=whisper-source-${TAG}"
            echo "exists=$EXISTS"
            echo "llama_tag=$LT"
            echo "llama_ggml_tree=$LT_TREE"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $UT -> $TAG ($COMMIT); release exists=$EXISTS; paired llama=$LT"

      - name: Upload stamped source artifact
        if: ${{ steps.r.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.r.outputs.source_artifact }}
          path: ${{ runner.temp }}/whisper.cpp-source-${{ steps.r.outputs.tag }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-slim:
    name: Slim
    needs: resolve
    if: ${{ needs.resolve.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/unsloth-prebuilt-slim.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      upstream_tag: ${{ needs.resolve.outputs.upstream_tag }}
      repo: ${{ needs.resolve.outputs.repo }}
      commit: ${{ needs.resolve.outputs.commit }}
      source_artifact: ${{ needs.resolve.outputs.source_artifact }}
      llama_tag: ${{ needs.resolve.outputs.llama_tag }}
      llama_ggml_tree: ${{ needs.resolve.outputs.llama_ggml_tree }}

  assemble:
    name: Assemble metadata + publish
    needs: [resolve, build-slim]
    # P0 gate: the slim child is the release. Every slice (incl. windows/arm64,
    # now built natively on windows-11-arm) is required, so a build-slim
    # success hard-implies every slice; the "Verify P0 coverage" step below
    # re-checks the required asset set by name. A slim child failure
    # short-circuits here and nothing is published.
    if: >-
      always()
      && needs.resolve.result == 'success'
      && needs.build-slim.result == 'success'
      && (needs.resolve.outputs.exists != 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout build tooling (this repo)
        uses: actions/checkout@v6
        with:
          path: tooling

      - name: Download built bundles
        id: download
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          path: dist
          pattern: whisper-*
          merge-multiple: true

      - name: Download built bundles (retry)
        if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: whisper-*
          merge-multiple: true

      - name: Fetch stamped source archive
        run: |
          set -eux
          TAG='${{ needs.resolve.outputs.tag }}'
          # The resolve job's source artifact lands whisper.cpp-source-<tag>.tar.gz
          # in dist/ via the whisper-* download; also stamp the commit-named copy.
          SHA='${{ needs.resolve.outputs.commit }}'
          cp "dist/whisper.cpp-source-${TAG}.tar.gz" "dist/whisper.cpp-source-commit-${SHA}.tar.gz"

      # Branding gate: every bundle must carry the Unsloth fingerprint that
      # package_bundle.py writes into its BUILD_INFO.txt (whisper-server has no
      # compiled build-info string to bake it into, unlike llama.cpp). MARK must
      # stay byte-identical to that string. grep -ar scans recursively.
      - name: Verify Unsloth fingerprint in every bundle
        run: |
          set -euo pipefail
          MARK='Compiled by the Unsloth team'
          shopt -s nullglob
          tmp="$(mktemp -d)"; fail=0; checked=0
          for arc in dist/whisper-*.tar.gz dist/whisper-*.zip; do
            case "$arc" in *whisper.cpp-source-*) continue ;; esac
            d="$tmp/x"; rm -rf "$d"; mkdir -p "$d"
            case "$arc" in
              *.zip)    unzip -qo "$arc" -d "$d" ;;
              *.tar.gz) tar -xzf "$arc" -C "$d" ;;
            esac
            if grep -arq "$MARK" "$d"; then checked=$((checked+1));
            else echo "ERROR: $(basename "$arc"): no file carries the Unsloth fingerprint" >&2; fail=1; fi
          done
          rm -rf "$tmp"
          [ "$checked" -gt 0 ] || { echo "ERROR: no bundles found to verify" >&2; exit 1; }
          [ "$fail" = 0 ] || { echo "ERROR: refusing to publish unbranded binaries" >&2; exit 1; }
          echo "fingerprint verified in $checked bundles"

      - name: Verify P0 coverage before publish
        if: ${{ (inputs.publish || github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && needs.resolve.outputs.exists != 'true' }}
        run: |
          set -eu
          TAG='${{ needs.resolve.outputs.tag }}'
          # Required slim set: every os/arch slice, no exceptions.
          fail=0
          for f in \
            "whisper-${TAG}-linux-x64-slim.tar.gz" \
            "whisper-${TAG}-linux-arm64-slim.tar.gz" \
            "whisper-${TAG}-windows-x64-slim.zip" \
            "whisper-${TAG}-windows-arm64-slim.zip" \
            "whisper-${TAG}-macos-x64-slim.tar.gz" \
            "whisper-${TAG}-macos-arm64-slim.tar.gz"; do
            [ -s "dist/$f" ] || { echo "ERROR: missing required P0 asset $f" >&2; fail=1; }
          done
          [ "$fail" = 0 ] || { echo "ERROR: refusing to publish an incomplete P0 set" >&2; exit 1; }
          echo "P0 coverage complete"

      - name: Generate manifest + sha256 index
        run: |
          set -eux
          python3 tooling/scripts/package_bundle.py \
            --emit-manifest --emit-sha256 \
            --dist dist --out dist \
            --tag '${{ needs.resolve.outputs.tag }}' \
            --upstream-tag '${{ needs.resolve.outputs.upstream_tag }}' \
            --commit '${{ needs.resolve.outputs.commit }}' \
            --source-repo "$GITHUB_REPOSITORY" \
            --llama-tag '${{ needs.resolve.outputs.llama_tag }}' \
            --llama-ggml-tree '${{ needs.resolve.outputs.llama_ggml_tree }}'
          # Drop the per-asset .entry.json sidecars: the manifest supersedes them.
          rm -f dist/*.entry.json
          ls -la dist

      - name: Upload full release set (artifacts)
        uses: actions/upload-artifact@v6
        with:
          name: unsloth-whisper-prebuilt-${{ needs.resolve.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub release (draft first, then atomic)
        if: ${{ (inputs.publish || github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && needs.resolve.outputs.exists != 'true' }}
        run: |
          set -eux
          TAG='${{ needs.resolve.outputs.tag }}'
          UT='${{ needs.resolve.outputs.upstream_tag }}'
          REPO="$GITHUB_REPOSITORY"
          LT='${{ needs.resolve.outputs.llama_tag }}'
          NOTES="Automated Unsloth whisper.cpp (whisper-server) slim prebuild for upstream [${UT}](https://github.com/ggml-org/whisper.cpp/releases/tag/${UT}). Every bundle is slim: it ships no ggml libraries and requires the paired [unslothai/llama.cpp ${LT}](https://github.com/unslothai/llama.cpp/releases/tag/${LT}) install, whose ggml provides every backend (CPU variants, CUDA, HIP, Vulkan, Metal)."
          # Atomic publish: upload as a draft (hidden from the anon API the
          # installer reads), then flip draft=false only once every asset landed.
          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
            gh release delete "$TAG" --repo "$REPO" --yes
          fi
          # Exclude the per-asset entry sidecars (already removed) and upload the
          # bundles, source tarballs, manifest and sha256 index.
          gh release create "$TAG" --repo "$REPO" --draft \
            --title "whisper.cpp prebuilt $TAG" \
            --notes "$NOTES" \
            dist/*
          gh release edit "$TAG" --repo "$REPO" --draft=false

  # Covers red runs. Green runs that publish nothing are covered by
  # unsloth-prebuilt-deadman.yml, which no failure trigger can see.
  alert:
    name: Report pipeline health
    needs: [resolve, build-slim, assemble]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.publish) }}
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout (for the composite action)
        uses: actions/checkout@v6
        with: { persist-credentials: false }

      - name: Summarise run
        id: s
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail
          # 'skipped' is healthy: an already-published, still-pairing tag skips the build.
          # 'cancelled' is not. On 08-05 all six bundles were cancelled seconds
          # after resolve and nothing was published, which this reported as
          # success: the silent no-publish this alerting exists to catch.
          FAILED="$(jq -r 'to_entries | map(select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(.value.result))") | join(", ")' <<<"$NEEDS_JSON")"
          if [ -z "$FAILED" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "details=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=failure" >> "$GITHUB_OUTPUT"
          REASON="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null \
            | grep -aE 'refusing |could not |ERROR: ' \
            | sed -E 's/^[0-9-]+T[0-9:.]+Z //' | cut -c1-300 | head -5 || true)"
          {
            echo 'details<<ALERT_EOF'
            echo "**Failed jobs:** ${FAILED}"
            if [ -n "$REASON" ]; then
              echo
              echo 'Reported reason:'
              echo
              echo '```'
              echo "$REASON"
              echo '```'
            fi
            echo
            echo "No whisper release was published. Studio will keep reporting the"
            echo "previously paired prebuilt, or none at all if the pairing is stale."
            echo 'ALERT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Alert
        uses: ./.github/actions/prebuilt-alert
        with:
          status: ${{ steps.s.outputs.status }}
          key: whisper-prebuilt-pipeline
          title: 'whisper.cpp prebuilt pipeline is failing'
          details: ${{ steps.s.outputs.details }}
          token: ${{ github.token }}
